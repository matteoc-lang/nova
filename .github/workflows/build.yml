name: Build Nova APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CI: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Remove UTF-8 BOM from source files
        run: |
          find nova -type f \( -name '*.json' -o -name '*.js' -o -name '*.ts' -o -name '*.tsx' \) \
            -not -path '*/node_modules/*' -print0 \
          | xargs -0 -r sed -i '1s/^\xEF\xBB\xBF//'

      - name: Validate JSON files
        run: |
          node -e "const fs=require('fs');['nova/package.json','nova/app.json','nova/tsconfig.json'].forEach(f=>{JSON.parse(fs.readFileSync(f,'utf8'));console.log('OK '+f)})"

      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Install JS dependencies
        working-directory: nova
        run: npm install --no-audit --no-fund

      - name: Force every Expo package to the SDK 52 version
        working-directory: nova
        run: |
          npx expo install --fix
          npx expo install expo-font expo-modules-core expo-av expo-linear-gradient expo-secure-store @expo/vector-icons @react-native-async-storage/async-storage @react-native-community/slider react-native-safe-area-context react-native-screens
          npx expo install --fix
          npm install --no-audit --no-fund

      - name: Generate Android project
        working-directory: nova
        run: npx expo prebuild --platform android --clean

      - name: Point Gradle to Android SDK
        run: echo "sdk.dir=$ANDROID_HOME" > nova/android/local.properties

      - name: Give Gradle more memory
        run: |
          echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g" >> nova/android/gradle.properties

      - name: Build RELEASE APK (JS bundle embedded)
        working-directory: nova/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: List built APKs
        run: ls -la nova/android/app/build/outputs/apk/release/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nova-apk
          path: nova/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
          if-no-files-found: error

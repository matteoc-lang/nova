name: Build Nova APK

on:
  push:
    branches: [main]
    paths:
      - 'nova/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

concurrency:
  group: nova-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CI: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('nova/package.json') }}
          restore-keys: npm-${{ runner.os }}-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('nova/package.json') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Cache Android NDK
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/ndk/26.1.10909125
          key: ndk-26.1.10909125-${{ runner.os }}

      - name: Remove UTF-8 BOM from source files
        run: |
          find nova -type f \( -name '*.json' -o -name '*.js' -o -name '*.ts' -o -name '*.tsx' \) \
            -not -path '*/node_modules/*' -print0 \
          | xargs -0 -r sed -i '1s/^\xEF\xBB\xBF//'

      - name: Validate JSON files
        run: |
          node -e "const fs=require('fs');['nova/package.json','nova/app.json','nova/tsconfig.json'].forEach(f=>{JSON.parse(fs.readFileSync(f,'utf8'));console.log('OK '+f)})"

      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Install JS dependencies
        working-directory: nova
        run: npm install --no-audit --no-fund

      - name: Align Expo SDK versions
        working-directory: nova
        run: npx expo install --fix

      - name: Install ALL required Expo packages explicitly
        working-directory: nova
        run: |
          npx expo install expo-asset expo-constants expo-file-system expo-keep-awake expo-font expo-modules-core expo-av expo-linear-gradient expo-secure-store expo-screen-orientation @expo/vector-icons @react-native-async-storage/async-storage @react-native-community/slider react-native-safe-area-context react-native-screens

      - name: Verify required packages are present
        working-directory: nova
        run: |
          missing=0
          for p in expo-asset expo-constants expo-file-system expo-keep-awake expo-font expo-modules-core expo-av expo-linear-gradient expo-secure-store expo-screen-orientation; do
            if [ -d "node_modules/$p" ]; then
              echo "OK      $p  $(node -p "require('./node_modules/$p/package.json').version")"
            else
              echo "MISSING $p"; missing=1
            fi
          done
          exit $missing

      - name: Generate Android project
        working-directory: nova
        run: npx expo prebuild --platform android --clean

      - name: Point Gradle to Android SDK
        run: echo "sdk.dir=$ANDROID_HOME" > nova/android/local.properties

      - name: Give Gradle more memory
        run: echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g" >> nova/android/gradle.properties

      - name: Build RELEASE APK
        working-directory: nova/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: List built APKs
        run: ls -la nova/android/app/build/outputs/apk/release/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nova-apk
          path: nova/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
          if-no-files-found: error

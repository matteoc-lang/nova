name: Build Nova APK

on:
  push:
    branches: [main]
    paths:
      - 'nova/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:
    inputs:
      debug:
        description: "Costruire anche l'APK debug (diagnostica)"
        required: false
        default: "false"

concurrency:
  group: nova-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      CI: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Cache npm
        id: cache-npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('nova/package.json') }}
          restore-keys: npm-${{ runner.os }}-

      - name: Cache Gradle (dipendenze + build cache)
        id: cache-gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('nova/package.json') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Report cache status
        run: |
          echo "npm    cache-hit=${{ steps.cache-npm.outputs.cache-hit }}"
          echo "gradle cache-hit=${{ steps.cache-gradle.outputs.cache-hit }}"

      - name: Remove UTF-8 BOM from source files
        run: |
          node -e '
            const fs = require("fs");
            const path = require("path");
            const exts = [".json", ".js", ".cjs", ".mjs", ".ts", ".tsx", ".svg"];
            let n = 0;
            function walk(dir) {
              for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
                if (entry.name === "node_modules" || entry.name === ".git") continue;
                const p = path.join(dir, entry.name);
                if (entry.isDirectory()) { walk(p); continue; }
                if (!exts.includes(path.extname(entry.name))) continue;
                const s = fs.readFileSync(p, "utf8");
                if (s.charCodeAt(0) === 0xFEFF) {
                  fs.writeFileSync(p, s.slice(1), "utf8");
                  n++;
                  console.log("BOM rimosso da " + p);
                }
              }
            }
            walk("nova");
            console.log("File corretti: " + n);
          '

      - name: Validate JSON files
        run: |
          node -e "const fs=require('fs');['nova/package.json','nova/app.json','nova/tsconfig.json','nova/modules/nova-pip/expo-module.config.json'].forEach(f=>{JSON.parse(fs.readFileSync(f,'utf8'));console.log('OK '+f)})"

      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Install JS dependencies and align SDK versions
        working-directory: nova
        run: |
          npm install --no-audit --no-fund --legacy-peer-deps
          npx expo install --fix
          npx expo install expo-notifications
          echo "react         $(node -p "require('./node_modules/react/package.json').version")"
          echo "react-native  $(node -p "require('./node_modules/react-native/package.json').version")"
          echo "notifications $(node -p "require('./node_modules/expo-notifications/package.json').version")"

      - name: Verify required packages
        working-directory: nova
        run: |
          missing=0
          for p in expo-asset expo-constants expo-file-system expo-keep-awake expo-font expo-modules-core expo-video expo-linear-gradient expo-navigation-bar expo-secure-store expo-screen-orientation expo-notifications; do
            if [ -d "node_modules/$p" ]; then
              echo "OK      $p  $(node -p "require('./node_modules/$p/package.json').version")"
            else
              echo "MISSING $p"; missing=1
            fi
          done
          test -f modules/nova-pip/android/src/main/java/expo/modules/novapip/NovaPipModule.kt || { echo "MISSING modulo nativo nova-pip"; missing=1; }
          exit $missing

      - name: Generate Android project
        working-directory: nova
        run: npx expo prebuild --platform android --clean

      - name: Apply custom launcher icon
        run: |
          set -e
          mkdir -p /tmp/icongen
          cd /tmp/icongen
          npm init -y >/dev/null 2>&1
          npm install sharp@0.33.5 --no-audit --no-fund --legacy-peer-deps
          cd "$GITHUB_WORKSPACE"
          ICON_SVG="$GITHUB_WORKSPACE/nova/assets/icon.svg" RES="$GITHUB_WORKSPACE/nova/android/app/src/main/res" NODE_PATH=/tmp/icongen/node_modules node nova/scripts/apply-icon.cjs
          find nova/android/app/src/main/res -name "ic_launcher*.png" | sort

      - name: Point Gradle to Android SDK
        run: echo "sdk.dir=$ANDROID_HOME" > nova/android/local.properties

      - name: Tune Gradle (memoria + build cache + parallelo)
        run: |
          echo "org.gradle.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=1g" >> nova/android/gradle.properties
          echo "org.gradle.caching=true" >> nova/android/gradle.properties
          echo "org.gradle.parallel=true" >> nova/android/gradle.properties

      - name: Build RELEASE APK
        working-directory: nova/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Build DEBUG APK (solo su richiesta)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.debug == 'true'
        working-directory: nova/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload RELEASE APK
        uses: actions/upload-artifact@v4
        with:
          name: nova-apk
          path: nova/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload DEBUG APK
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.debug == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: nova-apk-debug
          path: nova/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error
